<ul id="formats" class="menu w-full rounded-box border border-base-300 bg-base-100 p-1">
  {% for format in link.formats %}
  <li>
    <a href="/links/{{ link.id }}/archive/{{ format.key }}" target="_blank" rel="noopener">
      <span aria-hidden="true">{{ format.icon }}</span>{{ format.label }}
      <span class="icon-[lucide--external-link] ml-auto size-3.5 text-base-content/50"></span>
    </a>
  </li>
  {% endfor %}
</ul>
