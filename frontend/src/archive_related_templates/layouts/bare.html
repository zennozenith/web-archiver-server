{# Minimal layout (no `page` context needed): archive index, pending, error pages. #}
<!doctype html>
<html lang="en" data-theme="minimaltide">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ title }} - Web Archive{% endblock %}</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗄️</text></svg>"
    />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("theme") || "minimaltide";
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../../app.css" />

    <!-- htmx (vendored) -->
    <script src="/static/vite/vendored/htmx-4.0.0.min.js" defer></script>
    <!-- Alpine + components (bundled) -->
    <script type="module" src="../../app.ts"></script>

    {% block head %}{% endblock %}
  </head>

  <body class="min-h-dvh bg-base-100 text-base-content">
    <div
      id="error-container"
      class="toast toast-end toast-bottom z-50 max-w-sm empty:hidden"
      aria-live="polite"
      x-data="toastRegion"
      @click="dismiss($event)"
    ></div>

    {% block content %}
    <p>Placeholder content</p>
    {% endblock %}
  </body>
</html>
