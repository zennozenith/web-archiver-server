{# Replaces #page-tags-{page_i} after a tag is added or removed. Needs page_id and tags. #}

<div id="page-tags-{{ page_id }}" class="flex flex-wrap items-center gap-1.5">
  {% for tag in tags %}
  <span class="badge badge-ghost gap-1">
    {{ tag.name }}
    <button
      type="button"
      hx-delete="/api/page/{{ page_id }}/tag/{{ tag.id }}"
      hx-swap="none"
      hx-confirm="Remove this tag?"
      @htmx:after:request="$ok($event) && $el.parentElement.remove()"
      aria-label="Remove tag {{ tag.name }}"
      class="cursor-pointer text-base-content/40 hover:text-error"
    >
      ×
    </button>
  </span>
  {% endfor %}
</div>
