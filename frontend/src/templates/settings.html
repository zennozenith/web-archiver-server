{% extends "base_new.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<h1 class="text-2xl mb-4">⚙️ Settings</h1>
<div x-data="{ tab: 'account' }" class="max-w-3xl">
  <div role="tablist" class="tabs tabs-bordered mb-6">
    <a role="tab" class="tab" :class="tab=='account'&&'tab-active'" @click="tab='account'">Account</a>
    <a role="tab" class="tab" :class="tab=='preference'&&'tab-active'" @click="tab='preference'">Preference</a>
    <a role="tab" class="tab" :class="tab=='password'&&'tab-active'" @click="tab='password'">Password</a>
    <a role="tab" class="tab" :class="tab=='archive'&&'tab-active'" @click="tab='archive'">Archive</a>
    <a role="tab" class="tab" :class="tab=='api'&&'tab-active'" @click="tab='api'">Access Tokens</a>
  </div>

  <form x-show="tab=='account'" hx-put="/settings/account" hx-swap="none" class="space-y-3">
    <label class="form-control"><span class="label-text">Display name</span><input name="name"
        value="{{ page.user.name }}" class="input input-bordered"></label>
    <label class="form-control"><span class="label-text">Username</span><input name="username"
        value="{{ page.user.username }}" class="input input-bordered"></label>
    <label class="form-control"><span class="label-text">Email</span><input type="email" name="email"
        value="{{ page.user.email }}" class="input input-bordered"></label>
    <label class="label cursor-pointer justify-start gap-3"><input type="checkbox" name="public"
        class="toggle toggle-primary" {% if page.user.public %}checked{% endif %}><span>Make profile
        public</span></label>
    <button class="btn btn-primary">Save changes</button>
  </form>

  <form x-show="tab=='preference'" x-cloak hx-put="/settings/preferences" hx-swap="none" class="space-y-3">
    <label class="form-control"><span class="label-text">Theme</span>
      <select name="theme" class="select select-bordered" @change="document.documentElement.dataset.theme=$el.value">
        <option value="dark" {% if preferences.theme=="dark" %}selected{% endif %}>Dark</option>
        <option value="light" {% if preferences.theme=="light" %}selected{% endif %}>Light</option>
      </select></label>
    <label class="form-control"><span class="label-text">Language</span><select name="lang"
        class="select select-bordered">
        <option {% if preferences.lang=="English" %}selected{% endif %}>English</option>
        <option {% if preferences.lang=="Deutsch" %}selected{% endif %}>Deutsch</option>
      </select></label>
    <label class="label cursor-pointer justify-start gap-3"><input type="checkbox" name="archive_screenshot"
        class="toggle toggle-primary" {% if preferences.archive_screenshot %}checked{% endif %}><span>Archive
        screenshot</span></label>
    <label class="label cursor-pointer justify-start gap-3"><input type="checkbox" name="archive_pdf"
        class="toggle toggle-primary" {% if preferences.archive_pdf %}checked{% endif %}><span>Archive
        PDF</span></label>
    <label class="label cursor-pointer justify-start gap-3"><input type="checkbox" name="archive_html"
        class="toggle toggle-primary" {% if preferences.archive_html %}checked{% endif %}><span>Archive webpage
        (HTML)</span></label>
    <button class="btn btn-primary">Save changes</button>
  </form>

  <form x-show="tab=='password'" x-cloak hx-put="/settings/password" hx-swap="none" class="space-y-3">
    <input type="password" name="current" placeholder="Current password" class="input input-bordered w-full">
    <input type="password" name="new" placeholder="New password" class="input input-bordered w-full">
    <button class="btn btn-primary">Update password</button>
  </form>

  <div x-show="tab=='archive'" x-cloak class="space-y-3">
    <div class="flex gap-2"><a href="/export" class="btn">Export links (JSON)</a></div>
    <form hx-post="/import" hx-encoding="multipart/form-data" hx-swap="none" class="join">
      <input type="file" name="file" class="file-input file-input-bordered join-item"><button
        class="btn btn-primary join-item">Import</button>
    </form>
  </div>

  <div x-show="tab=='api'" x-cloak x-data="{ open:false }">
    <button class="btn btn-primary btn-sm mb-3" @click="open=!open">＋ New token</button>
    <form x-show="open" hx-post="/settings/tokens" hx-target="#tokens" hx-swap="append" class="join mb-3">
      <input name="name" placeholder="Token name" class="input input-bordered input-sm join-item">
      <select name="expires" class="select select-bordered select-sm join-item">
        <option>7 days</option>
        <option>30 days</option>
        <option>Never</option>
      </select>
      <button class="btn btn-sm join-item">Create</button>
    </form>
    <table class="table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Created</th>
          <th>Expires</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tokens">
        {% for token in tokens %}{% include "partials/token_row.html" %}{% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
