<!DOCTYPE html>

<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · Linkwarden</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗄️</text></svg>" />
  <link rel="stylesheet" href="../index.css" />

  <!-- htmx (vendored) -->
  <script src="/static/vite/vendored/htmx-4.0.0.min.js" defer></script>

  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>

<body class="min-h-screen grid place-items-center bg-base-200 p-4">
  <div class="card bg-base-100 w-full max-w-sm shadow-xl">
    <div class="card-body" x-data="{ show:false, mode:'{{ mode }}' }">
      <h1 class="card-title text-2xl" x-text="mode=='login' ? 'Welcome back' : 'Create your account'"></h1>
      <div id="auth-error">{% if !error.is_empty() %}<div class="alert alert-error">{{ error }}</div>{% endif %}</div>
      <form x-show="mode=='login'" hx-post="/login" hx-target="#auth-error" hx-disable="this" class="space-y-3">
        <input name="username" placeholder="Username or email" required class="input input-bordered w-full">
        <div class="join w-full"><input name="password" :type="show?'text':'password'" placeholder="Password" required
            class="input input-bordered join-item w-full">
          <button type="button" class="btn join-item" @click="show=!show" x-text="show?'Hide':'Show'"></button>
        </div>
        <button class="btn btn-primary w-full">Log in</button>
      </form>
      <form x-show="mode=='register'" x-cloak hx-post="/register" hx-target="#auth-error" hx-disable="this"
        class="space-y-3">
        <input name="name" placeholder="Display name" class="input input-bordered w-full">
        <input name="username" placeholder="Username or email" required class="input input-bordered w-full">
        <input name="password" type="password" placeholder="Password" required class="input input-bordered w-full">
        <button class="btn btn-primary w-full">Sign up</button>
      </form>
      <div class="divider text-xs">or</div>
      <a href="/auth/sso" class="btn btn-outline w-full">Continue with SSO</a>
      <p class="text-sm text-center mt-2">
        <span x-show="mode=='login'">New here? <a class="link link-primary" @click.prevent="mode='register'"
            href="#">Create an account</a></span>
        <span x-show="mode=='register'" x-cloak>Have an account? <a class="link link-primary"
            @click.prevent="mode='login'" href="#">Log in</a></span>
      </p>
    </div>
  </div>
</body>

</html>
