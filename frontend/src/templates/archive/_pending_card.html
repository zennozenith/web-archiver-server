<div id="pending-{{id}}" class="flex items-start gap-2 border-t border-base-300 py-3 first:border-t-0"
  data-pending-id="{{id}}" data-pending-status="{{status}}">
  <div class="min-w-0 flex-1">
    <a href="{{url}}" target="_blank" rel="noopener noreferrer"
      class="link link-primary link-hover block truncate text-sm">{{url}}</a>
    <div class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-base-content/50">
      <span class="badge badge-ghost badge-sm">{{status}}</span>
      <span>Added {{created_at}}</span>
    </div>
    <p class="mt-1 text-xs text-base-content/50">Tags: {{ tags }}</p>
  </div>
  <button type="button" hx-delete="/pending/{{id}}" hx-target="#pending-{{id}}" hx-swap="outerHTML"
    hx-confirm="Remove this URL from the queue?" class="btn btn-ghost btn-xs btn-square text-error shrink-0"
    aria-label="Remove from queue" title="Remove from queue">
    <span class="icon-[lucide--x] size-4"></span>
  </button>
</div>
