{% extends "base_new.html" %}
{% block title %}Tags{% endblock %}
{% block content %}
<div class="flex justify-between items-center mb-4">
  <h1 class="text-2xl"># Tags</h1>
  <input type="search" name="q" placeholder="Filter tags" class="input input-bordered input-sm" hx-get="/tags/search"
    hx-trigger="input delay:200ms" hx-target="#tag-list">
</div>
<div id="tag-list" class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
  {% for tag in tags %}{% include "partials/tag_card.html" %}{% endfor %}
</div>
{% endblock %}
