{% extends "base_new.html" %}
{% block title %}{{ form_title }}{% endblock %}
{% block content %}
<h1 class="text-2xl mb-4">{{ form_title }}{% if editing %} <span class="badge badge-warning badge-sm">editing</span>{%
  endif %}</h1>
<form method="post" action="{{ form_action }}" class="max-w-lg space-y-4" x-data="{ color: '{{ color }}' }">
  <label class="form-control"><span class="label-text">Name</span><input name="name" required value="{{ name }}"
      class="input input-bordered"></label>
  <label class="form-control"><span class="label-text">Description</span><textarea name="description" rows="3"
      class="textarea textarea-bordered">{{ description }}</textarea></label>
  <label class="form-control"><span class="label-text">Parent collection</span>
    <select name="parent_id" class="select select-bordered">
      <option value="">None</option>
      {% for collection in collections %}
      <option value="{{ collection.id }}" {% if collection.selected %}selected{% endif %}>{{ collection.emoji }} {{
        collection.name }}</option>
      {% endfor %}
    </select></label>
  <div class="flex items-center gap-3"><span class="label-text">Color</span>
    <input type="color" name="color" x-model="color" value="{{ color }}" class="w-10 h-10 rounded">
    <span class="badge" :style="`background:${color};color:#fff`" x-text="color"></span>
  </div>
  <div class="flex gap-2"><a href="/collections" class="btn btn-ghost">Cancel</a><button class="btn btn-primary">{{
      submit_label }}</button></div>
</form>
{% endblock %}
