<!DOCTYPE html>

<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard{% endblock %} · Linkwarden</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗄️</text></svg>" />
  <link rel="stylesheet" href="../index.css" />

  <!-- htmx (vendored) -->
  <script src="/static/vite/vendored/htmx-4.0.0.min.js" defer></script>

  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
</head>

<body class="bg-base-100" hx-headers:inherited='{"X-CSRF-Token": "{{ page.csrf_token }}"}'
  x-data="{ drawer: false, newLink: false }">
  <div class="drawer lg:drawer-open">
    <input id="nav" type="checkbox" class="drawer-toggle" x-model="drawer">
    <main class="drawer-content p-4 lg:p-6 min-w-0">
      <label for="nav" class="btn btn-ghost btn-sm lg:hidden mb-2">☰ Menu</label>
      <div id="error-container" aria-live="polite"></div>
      {% block content %}{% endblock %}
    </main>
    <aside class="drawer-side z-30">
      <label for="nav" class="drawer-overlay"></label>
      {% include "partials/sidebar.html" %}
    </aside>
  </div>

  {% include "partials/new_link_modal.html" %}

  {% block modals %}{% endblock %}
</body>

</html>
