{% if users.is_empty() %}
<div class="text-sm opacity-60 p-2">No matches</div>
{% else %}
<div class="rounded-box border border-base-300 divide-y divide-base-300 mb-2">
  {% for user in users %}
  <button type="button" class="flex w-full items-center gap-3 p-2 text-left hover:bg-base-200"
          hx-post="/collections/{{ collection_id }}/members" hx-vals='{"member":"{{ user.username }}"}' hx-target="#members" hx-swap="append">
    <span class="avatar placeholder"><span class="w-7 rounded-full bg-neutral text-neutral-content text-xs">{{ user.initial }}</span></span>
    <span class="flex-1">{{ user.name }} <span class="opacity-60 text-xs">@{{ user.username }}</span></span>
    <span class="text-primary">＋</span>
  </button>
  {% endfor %}
</div>
{% endif %}
