{% for a in audit.rows %}
<tr>
  <td class="whitespace-nowrap text-sm">
    <time datetime="{{ a.when.iso }}" data-local>{{ a.when.text }}</time>
  </td>
  <td><span class="badge badge-soft badge-sm {{ a.class }}">{{ a.action }}</span></td>
  <td class="text-sm">{{ a.actor }}</td>
  <td class="text-sm">{{ a.target }}</td>
  <td class="max-w-xs">
    <code class="block truncate font-data text-xs text-dim" title="{{ a.details }}">{{ a.details }}</code>
  </td>
</tr>
{% endfor %} {% if audit.rows.is_empty() %}
<tr>
  <td colspan="5" class="py-14 text-center text-dim">No events found.</td>
</tr>
{% endif %} {% if audit.has_more %}
<tr>
  <td colspan="5" class="text-center">
    <button
      type="button"
      class="btn btn-ghost btn-sm"
      hx-get="/admin/audit/rows?{{ audit.more_qs }}"
      hx-target="closest tr"
      hx-swap="outerHTML"
    >
      Load older events
    </button>
  </td>
</tr>
{% endif %}
