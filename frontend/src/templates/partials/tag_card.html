<div class="card bg-base-200 border border-base-300" x-data="{ editing: false }">
  <div class="card-body p-4 flex-row items-center justify-between">
    <a href="/tags/{{ tag.slug }}" class="text-lg" x-show="!editing"># {{ tag.name }} <span class="badge badge-ghost ml-1">{{ tag.count }}</span></a>
    <form x-show="editing" hx-put="/tags/{{ tag.id }}" hx-swap="none" @htmx:after:request="editing=false" class="join">
      <input name="name" value="{{ tag.name }}" class="input input-bordered input-sm join-item"><button class="btn btn-sm btn-primary join-item">Save</button></form>
    <div class="flex gap-1">
      <button class="btn btn-ghost btn-xs" @click="editing=!editing">✏️</button>
      <button class="btn btn-ghost btn-xs text-error" hx-delete="/tags/{{ tag.id }}" hx-confirm="Delete tag? Links are kept." hx-target="closest .card" hx-swap="outerHTML">🗑</button>
    </div>
  </div>
</div>
