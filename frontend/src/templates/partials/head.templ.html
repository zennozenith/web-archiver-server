<script>
  // Apply the saved (or system) theme before first paint to avoid a flash.
  (function () {
    try {
      var t = localStorage.getItem("userdemo-theme");
      if (!t && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "ledger-night";
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
