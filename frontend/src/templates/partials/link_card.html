<div class="link-card card card-compact bg-base-200 border border-base-300 overflow-hidden">
  <a href="/links/{{ link.id }}" class="thumb" style="background-image:url('{{ link.thumb }}')"></a>
  <div class="card-body">
    <div class="flex justify-between gap-2">
      <a href="/links/{{ link.id }}" class="card-title text-primary text-base leading-snug">{{ link.title }}</a>
      <div class="dropdown dropdown-end">
        <button tabindex="0" class="btn btn-ghost btn-xs">⋯</button>
        <ul tabindex="0" class="dropdown-content menu menu-sm bg-base-300 rounded-box z-10 w-40 shadow">
          <li><a hx-post="/links/{{ link.id }}/pin" hx-swap="none"
              hx-on:htmx:after:request="location.reload()">{% if link.pinned %}📌 Unpin{% else %}📌 Pin{% endif %}</a></li>
          <li><a href="/links/{{ link.id }}?edit=1">✏️ Edit</a></li>
          <li><a class="text-error" hx-delete="/links/{{ link.id }}" hx-confirm="Delete this link?" hx-target="closest .link-card" hx-swap="outerHTML">🗑 Delete</a></li>
        </ul>
      </div>
    </div>
    <p class="text-sm opacity-70 truncate">🔗 {{ link.domain }}</p>
    <div class="flex justify-between text-xs opacity-70 pt-1 border-t border-base-300">
      <a href="{{ link.collection_href }}">{{ link.collection_emoji }} {{ link.collection_name }}</a><span>{{ link.date }}</span>
    </div>
  </div>
</div>
