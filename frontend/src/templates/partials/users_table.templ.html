<div class="overflow-x-auto rounded-xl border border-line bg-surface">
  <table class="table">
    <thead>
      <tr><th>User</th><th>Status</th><th>Roles</th><th>Last sign-in</th><th>Joined</th><th class="w-0"><span class="sr-only">Actions</span></th></tr>
    </thead>
    <tbody>
      {% for u in table.rows %}{% include "partials/user_row.templ.html" %}{% endfor %}
      {% if table.rows.is_empty() %}
      <tr><td colspan="6" class="py-14 text-center text-dim">No users match these filters.</td></tr>
      {% endif %}
    </tbody>
  </table>
</div>

<div class="mt-3 flex flex-wrap items-center justify-between gap-2 text-sm">
  <span class="text-dim">Showing {{ table.pager.from }}–{{ table.pager.to }} of {{ table.pager.total }}</span>
  <div class="join">
    <button type="button" class="btn btn-sm join-item"
      {% if table.pager.has_prev %}hx-get="/users/table?{{ table.pager.prev_qs }}" hx-target="#users-results"{% else %}disabled{% endif %}>Previous</button>
    <button type="button" class="btn btn-sm join-item"
      {% if table.pager.has_next %}hx-get="/users/table?{{ table.pager.next_qs }}" hx-target="#users-results"{% else %}disabled{% endif %}>Next</button>
  </div>
</div>
