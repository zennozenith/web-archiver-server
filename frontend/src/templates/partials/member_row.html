<li class="flex items-center gap-3 p-3">
  <div class="avatar placeholder"><div class="w-9 rounded-full bg-neutral text-neutral-content"><span>{{ member.initial }}</span></div></div>
  <div class="flex-1"><div class="font-medium">{{ member.name }}</div><div class="text-xs opacity-60">@{{ member.username }}</div></div>
  {% if member.is_owner %}
  <span class="font-semibold">Owner</span>
  {% else %}
  <select name="role_{{ member.username }}" class="select select-ghost select-sm">
    <option {% if member.role == "Admin" %}selected{% endif %}>Admin</option>
    <option {% if member.role == "Contributor" %}selected{% endif %}>Contributor</option>
    <option {% if member.role == "Viewer" %}selected{% endif %}>Viewer</option>
  </select>
  <button type="button" class="btn btn-ghost btn-xs" hx-delete="/collections/{{ collection_id }}/members/{{ member.username }}" hx-target="closest li" hx-swap="outerHTML">✕</button>
  {% endif %}
</li>
