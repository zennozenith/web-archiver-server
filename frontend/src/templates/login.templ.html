{% extends "auth_base.templ.html" %}
{% block content %}
<h1 class="font-display text-3xl font-semibold">Sign in</h1>
<p class="mt-1 text-dim">Use your e-mail address or username.</p>

<form class="mt-8 space-y-3" hx-post="/login" hx-target="#form-alert">
  <fieldset class="fieldset">
    <legend class="fieldset-legend">E-mail or username</legend>
    <input class="input w-full" name="identifier" autocomplete="username" required autofocus>
  </fieldset>
  <fieldset class="fieldset">
    <legend class="fieldset-legend">Password</legend>
    <input class="input w-full" type="password" name="password" autocomplete="current-password" required>
  </fieldset>
  <div id="form-alert" aria-live="polite"></div>
  <button class="btn btn-primary w-full" type="submit">
    <span class="loading loading-spinner loading-sm htmx-indicator"></span>Sign in
  </button>
</form>

<div class="mt-6 flex justify-between text-sm">
  <a class="link" href="/forgot">Forgot password?</a>
  <a class="link" href="/register">Create an account</a>
</div>
{% endblock %}
