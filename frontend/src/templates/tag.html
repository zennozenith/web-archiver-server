{% extends "base_new.html" %}
{% block title %}# {{ tag.name }}{% endblock %}
{% block content %}
<h1 class="text-2xl mb-4"># {{ tag.name }} <span class="badge badge-ghost">{{ tag.count }}</span></h1>
<div id="results" class="grid gap-4 grid-cols-1 sm:grid-cols-2 xl:grid-cols-4">
  {% for link in links %}{% include "partials/link_card.html" %}{% endfor %}
</div>
{% if links.is_empty() %}
<div class="text-center py-16 opacity-70">
  <p class="text-lg">No links with this tag yet</p>
</div>
{% endif %}
{% endblock %}
