<div id="tag-{{ tag.id }}" class="flex gap-2 items-center py-2 border-t border-base-300 first:border-t-0"
  x-data="tagEditor">
  <div class="flex flex-1 min-w-0 items-center gap-2" x-show="!editing">
    <span class="flex-1 min-w-0 truncate">{{ tag.name }}</span>
    <span class="text-xs text-base-content/50 tabular-nums whitespace-nowrap">
      {{ tag.pages }} {% if tag.pages == 1 %}page{% else %}pages{% endif %}
      {% if tag.pending > 0 %}· {{ tag.pending }} queued{% endif %}
    </span>
    <button type="button" @click="start('{{ tag.name }}')"
      class="btn btn-xs btn-ghost border border-base-300 hover:bg-base-200">
      Rename
    </button>
    <button hx-delete="/tags/{{ tag.id }}" hx-swap="none"
      hx-confirm="Delete this tag? It will be removed from all pages."
      class="btn btn-xs btn-ghost border border-base-300 text-error hover:text-error-content hover:bg-error hover:border-error">
      Delete
    </button>
  </div>

  <form x-show="editing" x-cloak hx-patch="/tags/{{ tag.id }}" hx-swap="none"
    class="flex flex-1 min-w-0 items-center gap-1">
    <input x-ref="input" x-model="name" type="text" name="name" required
      class="input input-xs flex-1 min-w-0" aria-label="Rename {{ tag.name }}" />
    <button class="btn btn-xs btn-primary" type="submit">Save</button>
    <button class="btn btn-xs btn-ghost" type="button" @click="cancel()">Cancel</button>
  </form>
</div>
