<div id="pending-{{id}}" class="flex gap-2 items-start py-2 border-t border-base-300" data-pending-id="{{id}}"
  data-pending-status="{{status}}">
  <div class="flex-1 min-w-0">
    <strong class="block font-semibold">{{title}}</strong>
    <div class="w-fit max-w-full">
      <a href="{{url}}" target="_blank" rel="noopener noreferrer"
        class="block link link-primary text-sm truncate">{{url}}</a>
    </div>
    <span class="text-xs text-base-content/50">Added {{created_at}}</span>
    <span class="text-xs text-base-content/50 block"> Tags: {{ tags }}</span>
  </div>
  <button hx-delete="/pending/{{id}}" hx-target="closest [data-pending-id]" hx-swap="outerHTML"
    hx-confirm="Remove this URL from the queue?"
    class="btn btn-xs btn-ghost border border-base-300 text-error hover:text-error-content hover:bg-error hover:border-error shrink-0">
    Remove
  </button>
</div>
