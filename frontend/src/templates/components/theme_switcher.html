<div x-data="themeSwitcher" class="dropdown dropdown-top w-full">
  <button type="button" tabindex="0" class="btn btn-ghost btn-sm w-full justify-start">
    <span class="icon-[lucide--palette] size-4"></span>
    Theme
    <span class="ml-auto text-xs font-normal text-base-content/50"
      x-text="themes.find((t) => t.id === current)?.label"></span>
  </button>
  <ul tabindex="0"
    class="dropdown-content menu z-50 mb-1 w-full rounded-box border border-base-300 bg-base-100 p-1 shadow-lg">
    <template x-for="t in themes" :key="t.id">
      <li><button type="button" :class="current === t.id && 'menu-active'" @click="set(t.id); $el.blur()"
          x-text="t.label"></button></li>
    </template>
  </ul>
</div>
