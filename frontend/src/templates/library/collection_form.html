{% extends "layouts/app.html" %}
{% block title %}{{ form_title }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">{{ form_title }}
    {% if editing %}<span class="badge badge-warning badge-soft badge-sm">editing</span>{% endif %}</h1>
</div>

<form method="post" action="{{ form_action }}" class="flex max-w-lg flex-col gap-4"
  x-data="{ color: $el.dataset.color }" data-color="{{ color }}">

  <fieldset class="fieldset">
    <legend class="fieldset-legend">Name</legend>
    <input name="name" required value="{{ name }}" class="input w-full" />
  </fieldset>

  <fieldset class="fieldset">
    <legend class="fieldset-legend">Description</legend>
    <textarea name="description" rows="3" class="textarea w-full">{{ description }}</textarea>
  </fieldset>

  <fieldset class="fieldset">
    <legend class="fieldset-legend">Parent collection</legend>
    <select name="parentId" class="select w-full">
      <option value="">None</option>
      {% for collection in collections %}
      <option value="{{ collection.id }}" {% if collection.selected %}selected{% endif %}>{{ collection.emoji }} {{
        collection.name }}</option>
      {% endfor %}
    </select>
  </fieldset>

  <fieldset class="fieldset">
    <legend class="fieldset-legend">Color</legend>
    <div class="flex items-center gap-3">
      <input type="color" name="color" x-model="color" value="{{ color }}"
        class="size-10 cursor-pointer rounded-field border border-base-300 bg-transparent p-1"
        aria-label="Collection color" />
      <span class="badge badge-lg font-mono text-white" :style="{ background: color }" x-text="color"></span>
    </div>
  </fieldset>

  <div class="flex gap-2 pt-2">
    <a href="/collections" class="btn btn-ghost">Cancel</a>
    <button class="btn btn-primary">{{ submit_label }}</button>
  </div>
</form>
{% endblock %}
