{% extends "layouts/app.html" %}

{% block title %}Links{% endblock %}

{% block content %}
<div x-data="linkView">
  <div class="page-header">
    <h1 class="page-title"><span class="icon-[lucide--link]"></span>All links</h1>

    <form class="flex flex-wrap items-center gap-2" hx-get="/links/search" hx-target="#results" hx-sync="this:replace"
      hx-trigger="change, input delay:300ms from:input[name=q]">
      <label class="input input-sm w-48 sm:w-56">
        <span class="icon-[lucide--search] size-4 text-base-content/50"></span>
        <input name="q" type="search" placeholder="Filter links" aria-label="Filter links" />
      </label>
      <select name="sort" class="select select-sm w-auto" aria-label="Sort by">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="name">Name (A–Z)</option>
      </select>
      <select name="in" class="select select-sm w-auto" aria-label="Search in">
        <option value="name">in Name</option>
        <option value="url">in URL</option>
        <option value="text">in Content</option>
        <option value="tags">in Tags</option>
      </select>
      <div class="join" role="group" aria-label="Layout">
        <button type="button" class="btn btn-sm btn-square join-item" :class="view === 'grid' && 'btn-active'"
          :aria-pressed="view === 'grid'" @click="set('grid')" aria-label="Grid view">
          <span class="icon-[lucide--layout-grid] size-4"></span>
        </button>
        <button type="button" class="btn btn-sm btn-square join-item" :class="view === 'list' && 'btn-active'"
          :aria-pressed="view === 'list'" @click="set('list')" aria-label="List view">
          <span class="icon-[lucide--list] size-4"></span>
        </button>
      </div>
    </form>
  </div>

  <div id="results" class="link-grid group/results" data-view="grid" :data-view="view">
    {% include "library/_link_grid.html" %}
  </div>

  {% if let Some(cursor) = next_cursor %}
  <div hx-get="/links?cursor={{ cursor.to_string() }}" hx-trigger="intersect once" hx-target="#results" hx-swap="append"
    class="py-8 text-center">
    <span class="loading loading-dots"></span>
  </div>
  {% endif %}
</div>
{% endblock %}
