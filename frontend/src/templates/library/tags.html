{% extends "layouts/app.html" %}
{% block title %}Tags{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title"><span class="icon-[lucide--tags]"></span>Tags</h1>
  <label class="input input-sm w-56">
    <span class="icon-[lucide--search] size-4 text-base-content/50"></span>
    <input type="search" name="q" placeholder="Filter tags" aria-label="Filter tags" hx-get="/tags/search"
      hx-trigger="input delay:200ms" hx-target="#tag-list" />
  </label>
</div>

<div id="tag-list" class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
  {% for tag in tags %}{% include "library/_tag_card.html" %}{% endfor %}
</div>
{% endblock %}
