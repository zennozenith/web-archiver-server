{# Needs `collection`. Open with `share = true` from a parent x-data scope. #}
<dialog class="modal modal-bottom sm:modal-middle"
  x-effect="if (share) { if (!$el.open) $el.showModal() } else if ($el.open) { $el.close() }" @close="share = false">
  <div class="modal-box max-w-xl border border-base-300"
    x-data="{ pub: {% if collection.public %}true{% else %}false{% endif %}, copied: false }">
    <div class="mb-4 flex items-center justify-between">
      <h3 class="text-lg font-semibold">Share collection</h3>
      <button type="button" class="btn btn-ghost btn-sm btn-circle" @click="share = false" aria-label="Close">
        <span class="icon-[lucide--x] size-4"></span>
      </button>
    </div>

    <form hx-put="/collections/{{ collection.id }}/sharing" hx-swap="none"
      @htmx:after:request="if ($ok($event)) { share = false; location.reload() }" class="flex flex-col gap-4">
      <label class="flex cursor-pointer items-start gap-3">
        <input type="checkbox" name="public" class="toggle toggle-primary mt-0.5" x-model="pub" />
        <span>
          <span class="block font-medium">Make this a public collection</span>
          <span class="block text-sm text-base-content/60">Anyone with the link can view this collection and its
            links.</span>
        </span>
      </label>

      <fieldset class="fieldset" x-show="pub" x-transition>
        <legend class="fieldset-legend">Shareable link</legend>
        <div class="join w-full">
          <input x-ref="shareUrl" readonly value="{{ collection.share_url }}" class="input join-item w-full"
            aria-label="Shareable link" />
          <button type="button" class="btn join-item"
            @click="navigator.clipboard.writeText($refs.shareUrl.value); copied = true; setTimeout(() => copied = false, 1500)"
            x-text="copied ? 'Copied' : 'Copy'"></button>
        </div>
      </fieldset>

      <div class="modal-action mt-0">
        <button type="button" class="btn btn-ghost" @click="share = false">Cancel</button>
        <button class="btn btn-primary">Save changes</button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop"><button aria-label="Close">close</button></form>
</dialog>
