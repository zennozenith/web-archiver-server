<div class="card card-border bg-base-100" x-data="tagEditor" data-name="{{ tag.name }}">
  <div class="card-body flex-row items-center justify-between gap-2 p-3">
    <a href="/tags/{{ tag.slug }}" class="flex min-w-0 items-center gap-2 hover:text-primary" x-show="!editing">
      <span class="truncate"># {{ tag.name }}</span>
      <span class="badge badge-ghost badge-sm tabular-nums">{{ tag.count }}</span>
    </a>

    <form x-show="editing" x-cloak hx-put="/tags/{{ tag.id }}" hx-swap="none"
      @htmx:after:request="$ok($event) && location.reload()" class="join min-w-0 flex-1">
      <input x-ref="input" x-model="name" name="name" required class="input input-sm join-item min-w-0 flex-1"
        aria-label="Tag name" />
      <button class="btn btn-sm btn-primary join-item">Save</button>
      <button type="button" class="btn btn-sm join-item" @click="cancel()">Cancel</button>
    </form>

    <div class="flex shrink-0 gap-1" x-show="!editing">
      <button type="button" class="btn btn-ghost btn-xs btn-square" @click="start()" aria-label="Rename tag">
        <span class="icon-[lucide--pencil] size-4"></span>
      </button>
      <button type="button" class="btn btn-ghost btn-xs btn-square text-error" aria-label="Delete tag"
        hx-delete="/tags/{{ tag.id }}" hx-confirm="Delete tag? Links are kept." hx-target="closest .card"
        hx-swap="outerHTML">
        <span class="icon-[lucide--trash-2] size-4"></span>
      </button>
    </div>
  </div>
</div>
