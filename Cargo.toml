[package]
name = "web-archiver"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "A self-hosted web archive server that saves and replays rendered pages and their sub-resources"
readme = "README.md"
repository = "https://github.com/zennozenith/web-archiver-server"
license = "MIT"
keywords = ["archive", "axum", "self-hosted", "sqlite", "web"]
categories = ["database", "web-programming::http-server"]
publish = false
default-run = "web-archiver"

[[bin]]
name = "create_super_admin"
path = "src/bin/create_super_admin.rs"
required-features = ["admin-cli"]

[dependencies]
anyhow = "1"
argon2 = "0.6"
askama = "0.16.1"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
blake3 = "1.8.7"
brotli = "9.0.0"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
config = { version = "0.15.27", default-features = false, features = ["serde_json", "toml"] }
ego-tree = "=0.11.1"
flate2 = "1.1.10"
futures = "0.3.34"
getrandom = "0.4"
hex = "0.4"
html5ever = "=0.40.1"
http = "1.5.0"
lettre = { version = "0.11.23", default-features = false, features = [
  "builder",
  "smtp-transport",
  "tokio1-rustls-tls",
] }
log = "0.4" # `LevelFilter` for sqlx statement/slow-query logging
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", default-features = false, features = [
  "brotli",
  "deflate",
  "gzip",
  "rustls",
  "stream",
] }
rpassword = { version = "7.5.5", optional = true }
rust-embed = { version = "8.13.0", features = ["axum", "compression", "mime_guess"] }
scraper = "0.29.0"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde-aux = { version = "4.7.0", default-features = false }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["migrate", "runtime-tokio", "sqlite"] } # "chrono",
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.54.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = { version = "0.7", features = [
  "io",
  "rt",
] } # streaming files and graceful-shutdown cancellation
tower = { version = "0.5.3", features = ["limit", "util"] }
tower-http = { version = "0.7.1", features = [
  "cors",
  "fs",
  "limit",
  "request-id",
  "set-status",
  "timeout",
  "trace",
] }
tracing = "0.1.44"
tracing-appender = "0.2.4" # non-blocking, rotating log files
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
mime = "0.3.17"
tower = "0.5.3"

[features]
default = []
admin-cli = ["dep:rpassword"]

[lints.clippy]
# Whole groups (priority -1 so individual overrides below win)
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

allow_attributes = "deny" # forces #[expect] instead of #[allow]
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
default_union_representation = "deny"
empty_enum_variants_with_brackets = "deny"
exit = "deny"
# expect_used = "deny"
float_cmp = "deny"
fn_to_numeric_cast_any = "deny"
get_unwrap = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
multiple_inherent_impl = "deny"
panic = "deny"
panic_in_result_fn = "deny"
print_stderr = "deny"
print_stdout = "deny"
rc_buffer = "deny"
same_name_method = "deny"
shadow_unrelated = "deny"
str_to_string = "deny"
string_slice = "deny"
todo = "deny"
try_err = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unneeded_field_pattern = "deny"
unreachable = "deny"
# Hand-picked restriction lints (never enable the whole group)
unwrap_used = "deny"
verbose_file_reads = "deny"
wildcard_enum_match_arm = "deny"

missing_errors_doc = "allow" # remove for public libraries
missing_panics_doc = "allow"
# Sensible opt-outs for noisy lints
module_name_repetitions = "allow"
multiple_crate_versions = "allow" # usually out of your control
must_use_candidate = "allow"
# Binary crate: `pub(crate)` in a private module is intentional, and the
# `unreachable_pub` lint above already keeps these items crate-internal.
redundant_pub_crate = "allow"

[lints.rust]
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"
unsafe_code = "forbid"
unused_must_use = "deny"
# missing_docs = "deny"   # enable for libraries

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
