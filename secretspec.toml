[project]
name = "web-archiver-server"
revision = "1.0"

# Extend configurations from subdirectories
# extends = [ "subdir1", "subdir2" ]

[profiles.default]
# Used by `sqlx` (migrations, `sqlx database create`) and by the application
# when `APP_DATABASE__URL` is not set explicitly.
DATABASE_URL = { description = "SQLite connection string, e.g. sqlite://data/db/app.sqlite3", required = true }
# Only needed when `APP_MAIL__SMTP__HOST` is configured; debug builds log mail
# to the console instead.
APP_MAIL__SMTP__PASSWORD = { description = "SMTP password for APP_MAIL__SMTP__USERNAME", required = false }

[profiles.development]
# Development profile inherits all secrets from default profile
# Only define secrets here that need different values or settings than default
# DATABASE_URL = { default = "sqlite:///dev.db" }
#
# New secrets
# REDIS_URL = { description = "Redis connection URL for caching", required = false, default = "redis://localhost:6379" }

[profiles.production]
